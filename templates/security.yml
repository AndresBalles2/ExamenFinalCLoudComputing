AWSTemplateFormatVersion: '2010-09-09'
Description: Security groups for the solution

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC where the security groups will be created

Resources:
  PublicEC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for the public EC2 instance
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  ApplicationLoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for the Application Load Balancer
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

Outputs:
  PublicEC2SecurityGroupId:
    Description: Security Group ID for the public EC2 instance
    Value: !Ref PublicEC2SecurityGroup
    Export:
      Name: !Sub '${AWS::StackName}-PublicEC2SecurityGroupId'

  ApplicationLoadBalancerSecurityGroupId:
    Description: Security Group ID for the Application Load Balancer
    Value: !Ref ApplicationLoadBalancerSecurityGroup
    Export:
      Name: !Sub '${AWS::StackName}-ApplicationLoadBalancerSecurityGroupId'
