AWSTemplateFormatVersion: '2010-09-09'
Description: Simple ALB + Target Group + Launch Template + ASG + Warm Pool with Apache

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC where the stack will be deployed

  SecurityStackName:
    Type: String
    Description: Name of the stack that exports the ALB security group

  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Public subnets for the Application Load Balancer and instances

  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
      - t3.small
      - t3.medium
    Description: EC2 instance type for the Auto Scaling Group

  DesiredCapacity:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 4
    Description: Desired number of EC2 instances

  MinSize:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 4
    Description: Minimum number of EC2 instances in the Auto Scaling Group

  MaxSize:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 8
    Description: Maximum number of EC2 instances in the Auto Scaling Group

  WarmPoolPreparedCapacity:
    Type: Number
    Default: 1
    MinValue: 0
    MaxValue: 4
    Description: Number of instances kept ready in the warm pool

Resources:
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP traffic from the ALB to the web instances
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !ImportValue
            Fn::Sub: '${SecurityStackName}-ApplicationLoadBalancerSecurityGroupId'
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  WebTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      HealthCheckPath: /
      HealthCheckPort: '80'
      HealthCheckProtocol: HTTP
      Matcher:
        HttpCode: '200'
      Port: 80
      Protocol: HTTP
      TargetType: instance
      VpcId: !Ref VpcId

  WebLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      SecurityGroups:
        - !ImportValue
            Fn::Sub: '${SecurityStackName}-ApplicationLoadBalancerSecurityGroupId'
      Subnets: !Ref PublicSubnetIds
      Type: application

  WebListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref WebTargetGroup
      LoadBalancerArn: !Ref WebLoadBalancer
      Port: 80
      Protocol: HTTP

  WebLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2}}'
        InstanceType: !Ref InstanceType
        NetworkInterfaces:
          - DeviceIndex: 0
            AssociatePublicIpAddress: true
            Groups:
              - !Ref InstanceSecurityGroup
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -eux
            yum update -y
            yum install -y httpd
            systemctl enable httpd
            systemctl start httpd
            cat > /var/www/html/index.html <<'EOF'
            <html>
              <head><title>Cloud Computing</title></head>
              <body style="font-family: Arial; text-align: center; margin-top: 40px;">
                <h1>Aplicacion desplegada con Auto Scaling Group</h1>
                <p>Esta instancia fue creada automaticamente con UserData.</p>
              </body>
            </html>
            EOF

  WebAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: !Sub '${AWS::StackName}-asg'
      DesiredCapacity: !Ref DesiredCapacity
      HealthCheckGracePeriod: 120
      HealthCheckType: ELB
      LaunchTemplate:
        LaunchTemplateId: !Ref WebLaunchTemplate
        Version: !GetAtt WebLaunchTemplate.LatestVersionNumber
      MaxSize: !Ref MaxSize
      MinSize: !Ref MinSize
      TargetGroupARNs:
        - !Ref WebTargetGroup
      VPCZoneIdentifier: !Ref PublicSubnetIds
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-web'
          PropagateAtLaunch: true

  WebWarmPool:
    Type: AWS::AutoScaling::WarmPool
    Properties:
      AutoScalingGroupName: !Ref WebAutoScalingGroup
      MaxGroupPreparedCapacity: !Ref WarmPoolPreparedCapacity
      PoolState: Stopped

Outputs:
  LoadBalancerDNSName:
    Description: DNS name of the Application Load Balancer
    Value: !GetAtt WebLoadBalancer.DNSName

  LoadBalancerArn:
    Description: ARN of the Application Load Balancer
    Value: !Ref WebLoadBalancer

  TargetGroupArn:
    Description: ARN of the Target Group
    Value: !Ref WebTargetGroup
    Export:
      Name: !Sub '${AWS::StackName}-TargetGroupArn'

  InstanceSecurityGroupId:
    Description: Security Group ID used by the web instances
    Value: !Ref InstanceSecurityGroup
    Export:
      Name: !Sub '${AWS::StackName}-InstanceSecurityGroupId'

  PublicSubnetIds:
    Description: Public subnet IDs used by the stack
    Value: !Join [',', !Ref PublicSubnetIds]

  AutoScalingGroupName:
    Description: Name of the Auto Scaling Group
    Value: !Ref WebAutoScalingGroup
