AWSTemplateFormatVersion: '2010-09-09'
Description: Public EC2 instance with Apache and Elastic IP

Parameters:
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet where the instance will be launched

  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group for the EC2 instance

  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
    Description: EC2 instance type

Resources:
  WebServerInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2}}'
      InstanceType: !Ref InstanceType
      NetworkInterfaces:
        - DeviceIndex: 0
          SubnetId: !Ref SubnetId
          AssociatePublicIpAddress: true
          GroupSet:
            - !Ref SecurityGroupId
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          yum update -y
          yum install -y httpd
          systemctl enable httpd
          systemctl start httpd
          echo "<html><body><h1>Servidor Apache en EC2</h1></body></html>" > /var/www/html/index.html

  WebServerElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  WebServerElasticIpAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      InstanceId: !Ref WebServerInstance
      EIP: !Ref WebServerElasticIp

Outputs:
  InstanceId:
    Description: EC2 instance ID
    Value: !Ref WebServerInstance

  ElasticIp:
    Description: Elastic IP address assigned to the instance
    Value: !Ref WebServerElasticIp
